services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://retailpulse:retailpulse@db:5432/retailpulse
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retailpulse
      POSTGRES_USER: retailpulse
      POSTGRES_PASSWORD: retailpulse
    volumes:
      - retailpulse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpulse -d retailpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retailpulse-data:
